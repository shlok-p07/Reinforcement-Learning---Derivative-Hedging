[theme]
base                  = "dark"
primaryColor          = "#00d4aa"
backgroundColor       = "#070d1a"
secondaryBackgroundColor = "#0d1b2a"
textColor             = "#d4d8e2"
font                  = "sans serif"

[server]
headless              = true
port                  = 8501

[browser]
gatherUsageStats      = false

[client]
showErrorDetails      = false
toolbarMode           = "minimal"
